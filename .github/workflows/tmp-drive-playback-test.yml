name: Teste temporário de reprodução Drive
on:
  push:
    paths:
      - '.github/workflows/tmp-drive-playback-test.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Testar episódio público
        shell: bash
        run: |
          python - <<'PY'
          import urllib.request, urllib.error, json
          file_id="1jKIkI_mZVLbyK3hbxFomx0bGElL_MSa-"
          urls=[
            f"https://drive.google.com/file/d/{file_id}/preview",
            f"https://drive.google.com/uc?export=download&id={file_id}",
            f"https://drive.usercontent.google.com/download?id={file_id}&export=download&confirm=t"
          ]
          for url in urls:
            req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0"})
            try:
              r=urllib.request.urlopen(req,timeout=20)
              print("DRIVE_TEST="+json.dumps({
                "url":url,"status":r.status,"final":r.geturl(),
                "content_type":r.headers.get("content-type"),
                "length":r.headers.get("content-length")
              }))
              r.close()
            except Exception as e:
              print("DRIVE_TEST="+json.dumps({"url":url,"error":str(e)}))
          PY
