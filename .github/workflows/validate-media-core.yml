name: Validar núcleo de mídia

on:
  push:
    branches: [main]
    paths:
      - 'js/drive-sync.js'
      - 'js/drive-snapshot.js'
      - 'js/app.js'
      - 'js/data-filmes.js'
      - 'js/launcher-upgrade.js'
      - 'js/tv-catalog.js'
      - 'link-player.html'
      - 'tools/google-drive-sync.gs'
      - 'tools/test-drive-core.mjs'
      - '.github/workflows/validate-media-core.yml'
  pull_request:
    paths:
      - 'js/drive-sync.js'
      - 'js/drive-snapshot.js'
      - 'js/app.js'
      - 'js/data-filmes.js'
      - 'js/launcher-upgrade.js'
      - 'js/tv-catalog.js'
      - 'link-player.html'
      - 'tools/google-drive-sync.gs'
      - 'tools/test-drive-core.mjs'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar sintaxe do app
        run: |
          node --check js/app.js
          node --check js/data-filmes.js
          node --check js/launcher-upgrade.js
          node --check js/drive-sync.js
          node --check js/tv-catalog.js

      - name: Validar JavaScript do player HTML
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('link-player.html','utf8');
          const blocks=[...html.matchAll(/<script(?![^>]*\bsrc=)[^>]*>([\s\S]*?)<\/script>/gi)].map(m=>m[1].trim()).filter(Boolean);
          if(!blocks.length) throw new Error('Nenhum script inline encontrado em link-player.html');
          for(const [i,code] of blocks.entries()){
            try{ new Function(code); }
            catch(e){ throw new Error('Script inline '+(i+1)+' inválido: '+e.message); }
          }
          console.log('link-player.html:',blocks.length,'bloco(s) JavaScript válido(s)');
          NODE

      - name: Validar catálogo e parser do Drive
        run: node tools/test-drive-core.mjs
