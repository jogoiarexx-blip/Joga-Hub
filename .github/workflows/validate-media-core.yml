name: Validar núcleo de mídia

on:
  push:
    branches: [main]
    paths:
      - 'js/drive-media-policy.js'
      - 'js/drive-subtitle-core.js'
      - 'js/drive-subtitles.js'
      - 'js/drive-sync.js'
      - 'js/drive-snapshot.js'
      - 'js/app.js'
      - 'js/catalog-core.js'
      - 'js/navigation-core.js'
      - 'js/data-links.js'
      - 'js/data-filmes.js'
      - 'js/launcher-upgrade.js'
      - 'js/tv-catalog.js'
      - 'link-player.html'
      - 'css/player.css'
      - 'js/player-app.js'
      - 'js/player-drive-routes.js'
      - 'js/player-offline-manager.js'
      - 'tools/test-player-offline-manager.mjs'
      - 'tools/test-player-drive-routes.mjs'
      - 'js/player-drive-core.js'
      - 'js/player-drive-reconnect.js'
      - 'tools/test-player-drive-reconnect.mjs'
      - 'js/player-media-qa.js'
      - 'js/player-browser-core.js'
      - 'js/player-drive-diagnostics.js'
      - 'js/drive-health-core.js'
      - 'js/drive-health-panel.js'
      - 'js/player-episode-core.js'
      - 'tools/google-drive-sync.gs'
      - 'tools/test-drive-core.mjs'
      - 'tools/test-drive-media-policy.mjs'
      - 'tools/test-drive-subtitle-core.mjs'
      - 'tools/test-player-drive-core.mjs'
      - 'tools/test-player-media-qa.mjs'
      - 'tools/drive-live-probe.mjs'
      - 'tools/test-drive-live-probe.mjs'
      - 'tools/test-player-browser-core.mjs'
      - 'tools/test-player-drive-diagnostics.mjs'
      - 'tools/test-drive-health-core.mjs'
      - 'tools/test-player-episode-core.mjs'
      - 'tools/test-catalog-core.mjs'
      - 'tools/test-navigation-core.mjs'
      - 'tools/drive-snapshot-policy.mjs'
      - 'tools/test-drive-snapshot-policy.mjs'
      - '.github/workflows/validate-media-core.yml'
  pull_request:
    paths:
      - 'js/drive-media-policy.js'
      - 'js/drive-subtitle-core.js'
      - 'js/drive-subtitles.js'
      - 'js/drive-sync.js'
      - 'js/drive-snapshot.js'
      - 'js/app.js'
      - 'js/catalog-core.js'
      - 'js/navigation-core.js'
      - 'js/data-filmes.js'
      - 'js/launcher-upgrade.js'
      - 'js/tv-catalog.js'
      - 'link-player.html'
      - 'css/player.css'
      - 'js/player-app.js'
      - 'js/player-drive-routes.js'
      - 'js/player-offline-manager.js'
      - 'tools/test-player-offline-manager.mjs'
      - 'tools/test-player-drive-routes.mjs'
      - 'js/player-drive-core.js'
      - 'js/player-drive-reconnect.js'
      - 'tools/test-player-drive-reconnect.mjs'
      - 'js/player-media-qa.js'
      - 'js/player-browser-core.js'
      - 'js/player-drive-diagnostics.js'
      - 'js/drive-health-core.js'
      - 'js/drive-health-panel.js'
      - 'js/player-episode-core.js'
      - 'tools/google-drive-sync.gs'
      - 'tools/test-drive-core.mjs'
      - 'tools/test-drive-media-policy.mjs'
      - 'tools/test-drive-subtitle-core.mjs'
      - 'tools/test-player-drive-core.mjs'
      - 'tools/test-player-media-qa.mjs'
      - 'tools/drive-live-probe.mjs'
      - 'tools/test-drive-live-probe.mjs'
      - 'tools/test-player-browser-core.mjs'
      - 'tools/test-player-drive-diagnostics.mjs'
      - 'tools/test-drive-health-core.mjs'
      - 'tools/test-player-episode-core.mjs'
      - 'tools/test-catalog-core.mjs'
      - 'tools/test-navigation-core.mjs'
      - 'tools/drive-snapshot-policy.mjs'
      - 'tools/test-drive-snapshot-policy.mjs'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar sintaxe do app
        run: |
          node --check js/app.js
          node --check js/catalog-core.js
          node --check js/navigation-core.js
          node --check js/player-drive-core.js
          node --check js/player-drive-reconnect.js
          node --check js/player-drive-routes.js
          node --check js/player-offline-manager.js
          node --check js/player-app.js
          node --check js/player-media-qa.js
          node --check js/player-browser-core.js
          node --check js/player-drive-diagnostics.js
          node --check js/drive-health-core.js
          node --check js/drive-health-panel.js
          node --check js/player-episode-core.js
          node --check js/data-links.js
          node --check js/data-filmes.js
          node --check js/launcher-upgrade.js
          node --check js/drive-media-policy.js
          node --check js/drive-subtitle-core.js
          node --check js/drive-subtitles.js
          node --check js/drive-sync.js
          node --check js/tv-catalog.js

      - name: Validar Drive Engine e recuperação do player
        run: node --test tools/test-player-drive-core.mjs

      - name: Validar recuperação ao reconectar o Drive
        run: node --test tools/test-player-drive-reconnect.mjs

      - name: Validar diagnósticos de falha do Drive
        run: node --test tools/test-player-drive-diagnostics.mjs

      - name: Validar privacidade e estado do painel Drive
        run: node --test tools/test-drive-health-core.mjs

      - name: Validar compatibilidade entre navegadores
        run: node --test tools/test-player-browser-core.mjs

      - name: Validar evidências de áudio, busca e decodificação
        run: node --test tools/test-player-media-qa.mjs

      - name: Validar sondagem HTTP Range de arquivos públicos do Drive
        run: node --test tools/test-drive-live-probe.mjs

      - name: Validar sequência e passagem de episódios
        run: node --test tools/test-player-episode-core.mjs

      - name: Validar módulos extraídos do player e privacidade do cache Drive
        run: node --test tools/test-player-drive-routes.mjs

      - name: Validar downloads offline, cancelamento e integridade do cache
        run: node --test tools/test-player-offline-manager.mjs

      - name: Validar núcleo isolado de catálogo
        run: node --test tools/test-catalog-core.mjs

      - name: Validar filtros e navegação isolados
        run: node --test tools/test-navigation-core.mjs

      - name: Validar formatos de vídeo, legendas e chaves compartilhadas
        run: node --test tools/test-drive-media-policy.mjs

      - name: Validar associação de legendas aos episódios
        run: node --test tools/test-drive-subtitle-core.mjs

      - name: Validar catálogo e parser do Drive
        run: node tools/test-drive-core.mjs

      - name: Validar política de integridade do catálogo
        run: node --test tools/test-drive-snapshot-policy.mjs
