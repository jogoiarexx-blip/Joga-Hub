name: Aplicar pacote JogaHub

on:
  workflow_dispatch:
  issues:
    types: [opened]

permissions:
  contents: write

concurrency:
  group: jogahub-payload-deploy
  cancel-in-progress: false

jobs:
  apply:
    if: github.event_name == 'workflow_dispatch' || github.event.issue.title == 'DEPLOY JOGAHUB 1.3.3'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Aplicar pacote de código
        shell: bash
        run: |
          base64 -d tools/jogahub-deploy-payload.b64 > /tmp/jogahub-payload.tar.gz
          tar -xzf /tmp/jogahub-payload.tar.gz
          rm -f tools/jogahub-deploy-payload.b64
          rm -f .github/workflows/optimize-jogahub-images.yml

      - name: Otimizar imagens grandes
        run: |
          python -m pip install --disable-pip-version-check pillow
          python tools/optimize-jogahub-images.py

      - name: Validar JavaScript principal
        shell: bash
        run: |
          node --check js/app.js
          node --check js/drive-sync.js
          node --check js/core-upgrades.js
          node --check js/site-upgrades.js
          node --check js/launcher-upgrade.js
          node --check sw.js
          node tools/test-drive-core.mjs

      - name: Publicar versão final
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nenhuma mudança encontrada."
            exit 0
          fi
          git commit -m "Publica JogaHub 1.3.3 Performance"
          git push
