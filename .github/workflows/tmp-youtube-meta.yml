name: Ler metadados YouTube temporariamente
on:
  push:
    paths:
      - '.github/workflows/tmp-youtube-meta.yml'
permissions:
  contents: read
jobs:
  metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Consultar YouTube oEmbed
        shell: bash
        run: |
          python - <<'PY'
          import json, urllib.parse, urllib.request
          video="https://www.youtube.com/watch?v=MrpiY2Tyhug"
          url="https://www.youtube.com/oembed?"+urllib.parse.urlencode({"url":video,"format":"json"})
          with urllib.request.urlopen(url, timeout=20) as r:
              data=json.load(r)
          print("JOGAHUB_YT_META="+json.dumps({
              "title":data.get("title"),
              "author_name":data.get("author_name"),
              "thumbnail_url":data.get("thumbnail_url"),
              "provider_name":data.get("provider_name")
          }, ensure_ascii=False))
          PY
