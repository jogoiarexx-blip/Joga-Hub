name: Varredura temporária de canais YouTube
on:
  push:
    paths:
      - '.github/workflows/tmp-channel-scan.yml'
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Listar vídeos públicos
        shell: bash
        run: |
          python -m pip install -q yt-dlp
          python - <<'PY'
          import json, subprocess, urllib.parse, urllib.request

          video="https://www.youtube.com/watch?v=MrpiY2Tyhug"
          oembed="https://www.youtube.com/oembed?"+urllib.parse.urlencode({"url":video,"format":"json"})
          with urllib.request.urlopen(oembed, timeout=20) as r:
              meta=json.load(r)
          first=meta.get("author_url")
          channels=[
              ("Terroreterno lup", first),
              ("Zerando Games Rexx", "https://www.youtube.com/@zerandogamesrexx1064")
          ]
          print("CHANNEL_META="+json.dumps({"first_author_url":first,"first_author_name":meta.get("author_name")},ensure_ascii=False))
          for label,url in channels:
              target=(url.rstrip("/")+"/videos") if url else ""
              cmd=["yt-dlp","--flat-playlist","--playlist-end","100","--dump-single-json",target]
              try:
                  raw=subprocess.check_output(cmd,stderr=subprocess.STDOUT,text=True,timeout=180)
                  data=json.loads(raw)
                  out=[]
                  for e in data.get("entries") or []:
                      out.append({
                        "id":e.get("id"),
                        "title":e.get("title"),
                        "duration":e.get("duration"),
                        "timestamp":e.get("timestamp"),
                        "url":e.get("url"),
                        "live_status":e.get("live_status")
                      })
                  print("CHANNEL_SCAN="+json.dumps({"label":label,"url":url,"count":len(out),"entries":out},ensure_ascii=False))
              except subprocess.CalledProcessError as e:
                  print("CHANNEL_ERROR="+json.dumps({"label":label,"url":url,"error":e.output[-4000:]},ensure_ascii=False))
              except Exception as e:
                  print("CHANNEL_ERROR="+json.dumps({"label":label,"url":url,"error":str(e)},ensure_ascii=False))
          PY
