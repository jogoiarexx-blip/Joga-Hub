<!doctype html>
<html lang="pt-br"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#070a10"><meta name="application-name" content="JogaHub"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="JogaHub"><title>Instalar JogaHub</title><link rel="manifest" href="manifest.webmanifest?v=141"><link rel="icon" href="assets/favicon.png"><link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon-180.png"><style>
*{box-sizing:border-box}body{margin:0;background:#08080f;color:#fff;font-family:Inter,system-ui,Arial,sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:min(680px,100%);background:#12121d;border:1px solid #2b2b42;border-radius:24px;padding:28px;box-shadow:0 24px 80px #0008}.brand{display:flex;gap:14px;align-items:center}.brand img{width:64px;height:64px;border-radius:16px}.brand h1{margin:0;font-size:30px}.muted{color:#b9b9c9;line-height:1.6}.install{width:100%;padding:16px;border:0;border-radius:14px;background:linear-gradient(135deg,#2ac8f4,#7a5cff);color:#fff;font-size:17px;font-weight:800;cursor:pointer;margin:14px 0}.steps{background:#0c0c14;border-radius:16px;padding:18px;margin-top:16px;border:1px solid #222237}.steps h2{font-size:18px;margin-top:0}.steps ol{padding-left:22px;line-height:1.7}.back{display:inline-block;margin-top:18px;color:#fff;text-decoration:none}.ok{color:#78e6a3;font-weight:700}.warn{color:#ffd27a;font-weight:700}.platform{padding:12px 14px;border-radius:12px;background:#0b1620;border:1px solid #19364a;margin:12px 0;color:#dff8ff}.hidden{display:none!important}</style></head><body>
<main class="card"><div class="brand"><img src="assets/icon-192.png" alt=""><div><small>JogaHub PWA</small><h1>Instalar o JogaHub</h1></div></div><p class="muted">Instale o JogaHub como aplicativo. Ele ganha ícone na tela inicial e abre em uma janela própria.</p><div id="platform" class="platform"></div><button id="install" class="install">⬇ Instalar JogaHub</button><p id="status" class="muted">Verificando se o instalador automático está disponível…</p>
<section class="steps"><h2>Instalação manual</h2><ol id="steps"></ol></section><a class="back" href="./">← Voltar ao JogaHub</a></main>
<script>
let promptEvent=null;const btn=document.getElementById('install'),status=document.getElementById('status'),steps=document.getElementById('steps'),platform=document.getElementById('platform');const ua=navigator.userAgent||'';const isiOS=/iphone|ipad|ipod/i.test(ua)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);const isAndroid=/android/i.test(ua);const standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
if(isiOS){platform.textContent='📱 iPhone/iPad detectado';steps.innerHTML='<li>Abra esta página no <b>Safari</b>.</li><li>Toque em <b>Compartilhar</b> (quadrado com seta para cima).</li><li>Role e escolha <b>Adicionar à Tela de Início</b>.</li><li>Confirme em <b>Adicionar</b>.</li>';btn.textContent='Ver instruções para iPhone/iPad';}
else if(isAndroid){platform.textContent='🤖 Android detectado';steps.innerHTML='<li>Prefira o <b>Google Chrome</b>.</li><li>Toque no botão <b>Instalar JogaHub</b> acima.</li><li>Se não abrir, toque em <b>⋮</b> → <b>Instalar app</b> ou <b>Adicionar à tela inicial</b>.</li>';setTimeout(()=>{if(!promptEvent&&!standalone)status.innerHTML='<span class="warn">O Chrome ainda não liberou o prompt automático. Você pode instalar pelo menu ⋮.</span>'},2500);}
else{platform.textContent='💻 Navegador detectado';steps.innerHTML='<li>No Chrome/Edge, procure o ícone de instalação na barra de endereço.</li><li>Ou abra o menu do navegador e escolha <b>Instalar JogaHub</b>.</li>';};
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();promptEvent=e;status.innerHTML='<span class="ok">✓ Instalador automático pronto.</span>';if(!isiOS)btn.textContent='⬇ Instalar agora'});
window.addEventListener('appinstalled',()=>{status.innerHTML='<span class="ok">✓ JogaHub instalado.</span>';btn.textContent='✓ Instalado';promptEvent=null});
btn.onclick=async()=>{if(standalone){status.innerHTML='<span class="ok">✓ O JogaHub já está instalado.</span>';return}if(promptEvent){promptEvent.prompt();const choice=await promptEvent.userChoice;promptEvent=null;status.textContent=choice.outcome==='accepted'?'Instalação iniciada.':'Instalação cancelada. Você pode tentar novamente pelo menu do navegador.';return}if(isiOS){status.innerHTML='<span class="warn">Use Compartilhar → Adicionar à Tela de Início no Safari.</span>';return}status.innerHTML='<span class="warn">Use o menu do navegador: Instalar app / Adicionar à tela inicial.</span>'};
if(standalone){status.innerHTML='<span class="ok">✓ O JogaHub já está instalado neste aparelho.</span>';btn.textContent='✓ Instalado'}
if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js',{scope:'./',updateViaCache:'none'}).then(()=>navigator.serviceWorker.ready).catch(e=>{status.textContent='Falha ao preparar o instalador PWA. Atualize a página e tente novamente.'});
</script></body></html>
